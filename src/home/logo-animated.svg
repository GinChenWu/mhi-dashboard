<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>灰階空間 GRAYSCALE SPACE Logo</title>
  <defs>
    <filter id="paperNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="softNoise">
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
    <pattern id="paperGrain" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#808080" filter="url(#paperNoise)"/>
    </pattern>
  </defs>
  <style>
    .panel {
      mix-blend-mode: multiply;
      transform-box: fill-box;
      transform-origin: center;
    }
    .p1 { animation: altP1 6s ease-in-out infinite; }
    .p2 { animation: altP2 6s ease-in-out infinite; }
    .p3 { animation: altP3 6s ease-in-out infinite; }
    .p4 { animation: altP4 6s ease-in-out infinite; }
    .p5 { animation: altP5 6s ease-in-out infinite; }
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: altDot 6s ease-in-out infinite;
    }
    .wave {
      stroke-dasharray: 660;
      stroke-dashoffset: 0;
      animation: waveDraw 6s ease-in-out infinite;
    }

    /* Alternating bloom (1 -> 5 -> 3 -> 2 -> 4), hold full harmony, then alternating pulse (odd vs even) */
    @keyframes altP1 {
      0%, 4%   { opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
      14%, 56% { opacity: 0.92; filter: saturate(1); transform: translateY(0px); }
      66%, 74% { opacity: 0.95; filter: saturate(1.1); transform: translateY(-4px); }
      82%, 88% { opacity: 0.35; filter: saturate(0.15); transform: translateY(3px); }
      95%, 100%{ opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
    }
    @keyframes altP5 {
      0%, 10%  { opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
      20%, 56% { opacity: 0.92; filter: saturate(1); transform: translateY(0px); }
      66%, 74% { opacity: 0.96; filter: saturate(1.1); transform: translateY(-4px); }
      82%, 88% { opacity: 0.35; filter: saturate(0.15); transform: translateY(3px); }
      95%, 100%{ opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
    }
    @keyframes altP3 {
      0%, 16%  { opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
      26%, 56% { opacity: 0.88; filter: saturate(1); transform: translateY(0px); }
      66%, 74% { opacity: 0.94; filter: saturate(1.15); transform: translateY(-4px); }
      82%, 88% { opacity: 0.35; filter: saturate(0.15); transform: translateY(3px); }
      95%, 100%{ opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
    }
    @keyframes altP2 {
      0%, 22%  { opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
      32%, 56% { opacity: 0.88; filter: saturate(1); transform: translateY(0px); }
      66%, 74% { opacity: 0.35; filter: saturate(0.15); transform: translateY(3px); }
      82%, 88% { opacity: 0.94; filter: saturate(1.15); transform: translateY(-4px); }
      95%, 100%{ opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
    }
    @keyframes altP4 {
      0%, 28%  { opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
      38%, 56% { opacity: 0.88; filter: saturate(1); transform: translateY(0px); }
      66%, 74% { opacity: 0.35; filter: saturate(0.15); transform: translateY(3px); }
      82%, 88% { opacity: 0.94; filter: saturate(1.15); transform: translateY(-4px); }
      95%, 100%{ opacity: 0.14; filter: saturate(0); transform: translateY(6px); }
    }
    @keyframes altDot {
      0%, 34%  { opacity: 0; transform: scale(0.4); }
      44%, 58% { opacity: 1; transform: scale(1); }
      68%, 74% { opacity: 0.65; transform: scale(0.92); }
      82%, 88% { opacity: 1; transform: scale(1.12); }
      95%, 100%{ opacity: 0; transform: scale(0.4); }
    }
    @keyframes waveDraw {
      0%, 30%  { stroke-dashoffset: 660; opacity: 0; }
      46%, 88% { stroke-dashoffset: 0; opacity: 0.92; }
      96%, 100%{ stroke-dashoffset: -660; opacity: 0; }
    }
  </style>
  <rect width="1000" height="1000" fill="#E3DFD4" />
  <rect width="1000" height="1000" fill="url(#paperGrain)" opacity="0.22" />
  <!-- Emblem: Five overlapping matte panels with generous balance -->
  <g id="emblem" isolation="isolate">
    <path class="panel p1" d="M 262.00 276.00 Q 262.00 265.00 272.51 268.24 L 345.49 290.76 Q 356.00 294.00 356.00 305.00 L 356.00 549.00 Q 356.00 560.00 345.40 562.93 L 272.60 583.07 Q 262.00 586.00 262.00 575.00 Z" fill="#4B5456" opacity="0.92" />
    <path class="panel p2" d="M 344.00 325.00 Q 344.00 314.00 354.97 314.81 L 441.03 321.19 Q 452.00 322.00 452.00 333.00 L 452.00 575.00 Q 452.00 586.00 441.03 586.81 L 354.97 593.19 Q 344.00 594.00 344.00 583.00 Z" fill="#879495" opacity="0.88" />
    <path class="panel p3" d="M 440.00 301.00 Q 440.00 290.00 450.97 289.17 L 535.03 282.83 Q 546.00 282.00 546.00 293.00 L 546.00 547.00 Q 546.00 558.00 535.01 558.41 L 450.99 561.59 Q 440.00 562.00 440.00 551.00 Z" fill="#939B8C" opacity="0.88" />
    <path class="panel p4" d="M 534.00 347.00 Q 534.00 336.00 544.95 334.99 L 631.05 327.01 Q 642.00 326.00 642.00 337.00 L 642.00 581.00 Q 642.00 592.00 631.03 591.19 L 544.97 584.81 Q 534.00 584.00 534.00 573.00 Z" fill="#B09F87" opacity="0.88" />
    <path class="panel p5" d="M 630.00 307.00 Q 630.00 296.00 640.55 292.90 L 721.45 269.10 Q 732.00 266.00 732.00 277.00 L 732.00 577.00 Q 732.00 588.00 721.34 585.28 L 640.66 564.72 Q 630.00 562.00 630.00 551.00 Z" fill="#D6CBB9" opacity="0.92" />
    <!-- Warm ochre balance dot -->
    <circle class="dot" cx="580" cy="296" r="19" fill="#C08F4F" />
    <!-- Delicate flowing horizon line -->
    <path class="wave" d="M 200 474 C 360 388, 525 514, 798 396" fill="none" stroke="#C8C1B4" stroke-width="3.2" stroke-linecap="round" opacity="0.92" />
  </g>
